[dependency-groups]
dev = [ { include-group = "test" }, { include-group = "maintenance" } ]
test = [ { include-group = "build" }, "pytest==9.2" ]
audit = [ "twine==7" ]
build = [ "auditwheel==6.8.2", "hatch-npm-vendor==0.1", "hatchling==1.33", "packaging==26.3" ]
maintenance = [ "prek==0.5.10" ]
tox = [ "tox==4.67.11", "tox-uv==1.37.5" ]

[tool.uv]
package = false

[tool.uv.workspace]
members = [ "packages/*" ]

[tool.ruff]
target-version = "py311"
line-length = 80

[tool.ruff.lint]
extend-select = [ "B", "I", "UP" ]

[tool.ty]
src.include = [ "packages" ]
environment.root = [
  "packages/tailwindcss-bin/src",
  "packages/tailwindcss-bin-tailwindcss-motion/src",
  "packages/tailwindcss-bin-tw-animate-css/src",
  ".",
]
