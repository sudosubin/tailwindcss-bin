[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-npm-vendor>=0.1,<0.2", "hatchling>=1.27" ]

[project]
name = "tailwindcss-bin-tailwindcss-motion"
version = "1.1.1.dev1"
description = "tailwindcss-motion for tailwindcss-bin."
license = "MIT"
license-files = [ "LICENSE", "LICENSE-tailwindcss-motion" ]
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = []

[[project.authors]]
name = "sudosubin"
email = "sudosubin@gmail.com"

[project.entry-points]
"tailwindcss_bin.plugins".tailwindcss-motion = "tailwindcss_bin.plugins.tailwindcss_motion"

[[tool.hatch.build.targets.wheel.hooks.npm-vendor.packages]]
dest = "tailwindcss_bin/plugins/tailwindcss_motion/node_modules/tailwindcss-motion"
package = "tailwindcss-motion"
version = "1.1.1"
integrity = "sha512-CeeQAc5o31BuEPMyWdq/786X7QWNeifa+8khfu74Fs8lGkgEwjNYv6dGv+lRFS8FWXV5dp7F3AU9JjBXjiaQfw=="

[tool.hatch.build]
targets.wheel.packages = [ "src/tailwindcss_bin" ]
targets.wheel.hooks.npm-vendor.dependencies = [ "hatch-npm-vendor>=0.1,<0.2" ]

[tool.tailwindcss-bin.plugin]
npm = "tailwindcss-motion"
module = "tailwindcss_motion"
upstream-license = "LICENSE-tailwindcss-motion"
