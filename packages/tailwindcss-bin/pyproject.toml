[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.27" ]

[project]
name = "tailwindcss-bin"
version = "4.3.3.dev1"
description = "The Tailwind CSS standalone CLI, packaged as Python wheels."
readme = "README.md"
keywords = [ "binary", "cli", "css", "tailwind", "tailwindcss" ]
license = "MIT"
license-files = [ "LICENSE", "LICENSE-tailwindcss" ]
authors = [ { name = "sudosubin", email = "sudosubin@gmail.com" } ]
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Text Processing :: Markup",
]
dependencies = []
optional-dependencies.motion = [ "tailwindcss-bin-tailwindcss-motion>=1.1,<2" ]
optional-dependencies.tw-animate-css = [ "tailwindcss-bin-tw-animate-css>=1.4,<2" ]
urls.Repository = "https://github.com/sudosubin/tailwindcss-bin"
urls.Upstream = "https://github.com/tailwindlabs/tailwindcss"

[tool.hatch]
build.targets.wheel.packages = [ "src/tailwindcss_bin" ]
build.targets.wheel.hooks.custom = {}

[tool.uv]
sources.tailwindcss-bin-tailwindcss-motion = { workspace = true }
sources.tailwindcss-bin-tw-animate-css = { workspace = true }

[tool.cibuildwheel]
build = "cp314-*"
archs = [ "native" ]
build-frontend = "build[uv]"
repair-wheel-command = ""
test-command = "pytest tests/test_cli.py"
test-groups = [ "dev" ]
test-sources = [ "tests" ]
macos.archs = [ "x86_64", "arm64" ]
audit-command = "twine check --strict {wheel}"
audit-requires = [ "twine" ]

