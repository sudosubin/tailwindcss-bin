[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.27" ]

[project]
name = "tailwindcss-bin"
version = "4.3.3.dev1"
description = "The Tailwind CSS standalone CLI, packaged as Python wheels."
readme = "README.md"
keywords = [ "binary", "cli", "css", "tailwind", "tailwindcss" ]
license = "MIT"
license-files = [ "LICENSE", "LICENSE-tailwindcss" ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[[project.authors]]
name = "sudosubin"
email = "sudosubin@gmail.com"

[project.optional-dependencies]
tailwindcss-motion = [ "tailwindcss-bin-tailwindcss-motion" ]
tw-animate-css = [ "tailwindcss-bin-tw-animate-css" ]

[project.urls]
Repository = "https://github.com/sudosubin/tailwindcss-bin"
Upstream = "https://github.com/tailwindlabs/tailwindcss"

[project.scripts]
tailwindcss = "tailwindcss_bin.__main__:main"

[dependency-groups]
tox = [
  "tox==4.65.1",
  "tox-uv==1.28.1",
]

[tool.hatch.build]
targets.wheel.packages = [ "src/tailwindcss_bin" ]
targets.wheel.hooks.custom = {}

[tool.uv.sources]
tailwindcss-bin-tailwindcss-motion = { workspace = true }
tailwindcss-bin-tw-animate-css = { workspace = true }

[tool.cibuildwheel]
build = "cp314-*"
archs = [ "native" ]
build-frontend = "build[uv]"
repair-wheel-command = ""
test-command = "pytest tests/test_cli.py"
test-sources = [ "tests" ]
audit-command = "twine check --strict {wheel}"
audit-requires = [ "twine" ]

[tool.cibuildwheel.macos]
archs = [ "x86_64", "arm64" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
pythonpath = [ "src" ]

[tool.tox]
requires = [ "tox==4.65.1", "tox-uv==1.28.1" ]
env_list = [ "3.15", "3.14", "3.13", "3.12", "3.11", "build" ]

[tool.tox.env.build]
description = "Build workspace wheels into a shared wheelhouse"
package = "skip"
pass_env = [ "GITHUB_TOKEN", "TAILWINDCSS_BIN_TARGET" ]
change_dir = "{toxinidir}/../.."
commands = [
  [ "uv", "build", "--all-packages", "--wheel", "-o", ".tox/wheelhouse" ],
]
allowlist_externals = [ "uv" ]

[tool.tox.env_run_base]
package = "skip"
deps = [
  "hatchling>=1.27",
  "packaging",
  "pytest>=8",
  "tailwindcss-bin[tailwindcss-motion,tw-animate-css]",
]
pass_env = [ "TAILWINDCSS_BIN_TARGET" ]
set_env = { UV_FIND_LINKS = "{toxinidir}/../../.tox/wheelhouse" }
commands = [ [ "pytest", { replace = "posargs", extend = true } ] ]
depends = [ "build" ]

