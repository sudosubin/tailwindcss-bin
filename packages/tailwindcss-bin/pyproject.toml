[build-system]
build-backend = "hatchling.build"
requires = ["auditwheel>=6.8.2,<7", "hatchling>=1.27"]

[project]
name = "tailwindcss-bin"
version = "4.3.4"
description = "The Tailwind CSS standalone CLI, packaged as Python wheels."
readme = "README.md"
keywords = ["binary", "cli", "css", "tailwind", "tailwindcss"]
license = "MIT"
license-files = ["LICENSE", "LICENSE-tailwindcss"]
requires-python = ">=3.11"
classifiers = ["Development Status :: 5 - Production/Stable", "Environment :: Console", "Intended Audience :: Developers", "Operating System :: MacOS", "Operating System :: Microsoft :: Windows", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Topic :: Software Development :: Build Tools", "Topic :: Text Processing :: Markup"]
dependencies = []
[[project.authors]]
name = "sudosubin"
email = "sudosubin@gmail.com"

[project.optional-dependencies]
tailwindcss-motion = ["tailwindcss-bin-tailwindcss-motion"]
tw-animate-css = ["tailwindcss-bin-tw-animate-css"]

[project.urls]
Repository = "https://github.com/sudosubin/tailwindcss-bin"
Upstream = "https://github.com/tailwindlabs/tailwindcss"

[project.scripts]
tailwindcss = "tailwindcss_bin.__main__:main"
tailwindcss-bin = "tailwindcss_bin.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tailwindcss_bin"]

[tool.hatch.build.targets.wheel.hooks]
custom = {  }
[tool.uv.sources]
tailwindcss-bin-tailwindcss-motion = { workspace = true }
tailwindcss-bin-tw-animate-css = { workspace = true }
[tool.cibuildwheel]
build = "cp314-*"
archs = ["native"]
build-frontend = { name = "uv", args = ["--build-constraint", ".tox/build-constraints.txt", "--require-hashes"] }
repair-wheel-command = ""
before-test = "uv pip install --require-hashes -r {project}/.tox/test-requirements.txt && uv pip install --no-index --no-deps --pre --find-links {project}/.tox/plugin-wheelhouse tailwindcss-bin-tailwindcss-motion tailwindcss-bin-tw-animate-css"
test-command = "pytest packages/tailwindcss-bin/tests/test_cli.py packages/tailwindcss-bin/tests/test_plugins.py"
test-sources = ["packages/tailwindcss-bin/tests"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.tox]
requires = ["tox>=4.65.2,<5", "tox-uv>=1.37,<2"]
env_list = ["3.15", "3.14", "3.13", "3.12", "3.11", "build"]

[tool.tox.env.build]
description = "Build workspace wheels into a shared wheelhouse"
package = "skip"
deps = []
pass_env = ["GITHUB_TOKEN", "TAILWINDCSS_BIN_TARGET"]
change_dir = "{toxinidir}/../.."
commands_pre = []
commands = [["python", "-c", "import pathlib, shutil; shutil.rmtree('.tox/wheelhouse', ignore_errors=True); pathlib.Path('.tox').mkdir(exist_ok=True)"], ["uv", "export", "--frozen", "--only-group", "build", "--no-emit-project", "--output-file", ".tox/build-constraints.txt"], ["uv", "export", "--frozen", "--only-group", "test", "--no-emit-project", "--output-file", ".tox/test-requirements.txt"], ["uv", "build", "--package", "tailwindcss-bin", "--wheel", "--build-constraint", ".tox/build-constraints.txt", "--require-hashes", "-o", ".tox/wheelhouse"], ["uv", "build", "--package", "tailwindcss-bin-tailwindcss-motion", "--wheel", "--build-constraint", ".tox/build-constraints.txt", "--require-hashes", "-o", ".tox/wheelhouse"], ["uv", "build", "--package", "tailwindcss-bin-tw-animate-css", "--wheel", "--build-constraint", ".tox/build-constraints.txt", "--require-hashes", "-o", ".tox/wheelhouse"]]
allowlist_externals = ["uv"]
depends = []

[tool.tox.env_run_base]
package = "skip"
deps = ["-r{toxinidir}/../../.tox/test-requirements.txt"]
pass_env = ["TAILWINDCSS_BIN_TARGET"]
commands_pre = [["uv", "pip", "install", "--python", "{envpython}", "--no-index", "--no-deps", "--reinstall", "--prerelease", "allow", "--find-links", "{toxinidir}/../../.tox/wheelhouse", "tailwindcss-bin", "tailwindcss-bin-tailwindcss-motion", "tailwindcss-bin-tw-animate-css"]]
commands = [["pytest", { replace = "posargs", extend = true }]]
allowlist_externals = ["uv"]
depends = ["build"]

