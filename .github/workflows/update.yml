name: Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: Package to update (defaults to tailwindcss-bin)
        required: false
      version:
        description: Upstream version (defaults to latest)
        required: false

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  update:
    name: Update (${{ matrix.package }})
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.package == '' ||
      github.event.inputs.package == matrix.package
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - tailwindcss-bin
          - tailwindcss-bin-tailwindcss-motion
          - tailwindcss-bin-tw-animate-css
    env:
      PACKAGE: ${{ matrix.package }}
      PKG_DIR: packages/${{ matrix.package }}
      VERSION: ${{ github.event.inputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: plan core update
        id: plan-core
        if: matrix.package == 'tailwindcss-bin'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          version=${version:-$(gh release view --repo tailwindlabs/tailwindcss --json tagName --jq '.tagName[1:]')}
          branch="update/$PACKAGE-v$version"
          current=$(uv version --package "$PACKAGE" --short)
          if [ "$current" = "$version" ] || git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "changed=true"
            echo "version=$version"
            echo "branch=$branch"
            echo "body=https://github.com/tailwindlabs/tailwindcss/releases/tag/v$version"
          } >> "$GITHUB_OUTPUT"

      - name: plan plugin update
        id: plan-plugin
        if: matrix.package != 'tailwindcss-bin'
        run: |
          set -euo pipefail
          npm=$(yq -p=toml -oy '.tool."tailwindcss-bin".plugin.npm' "$PKG_DIR/pyproject.toml")
          version=${VERSION#v}
          version=${version:-$(curl -fsSL "https://registry.npmjs.org/$npm/latest" | jq -r .version)}
          branch="update/$PACKAGE-v$version"
          current=$(uv version --package "$PACKAGE" --short)
          if [ "$current" = "$version" ] || git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "changed=true"
            echo "version=$version"
            echo "branch=$branch"
            echo "npm=$npm"
            echo "body=https://www.npmjs.com/package/$npm/v/$version"
          } >> "$GITHUB_OUTPUT"

      - name: apply core update
        if: matrix.package == 'tailwindcss-bin' && steps.plan-core.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan-core.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --repo tailwindlabs/tailwindcss --json assets --jq '
            [.assets[]
              | select(.name | startswith("tailwindcss-"))
              | {(.name[11:] | rtrimstr(".exe")): (.digest // error("\(.name) has no digest") | .[7:])}
            ] | add' > "$RUNNER_TEMP/pins.json"
          curl -fsSL "https://raw.githubusercontent.com/tailwindlabs/tailwindcss/v$VERSION/LICENSE" \
            -o "$PKG_DIR/LICENSE-tailwindcss"
          yq -i -p=toml -o=toml \
            ".project.version = \"$VERSION\" |
             .tool.\"tailwindcss-bin\".sha256 = load(\"$RUNNER_TEMP/pins.json\")" \
            "$PKG_DIR/pyproject.toml"

      - name: apply plugin update
        if: matrix.package != 'tailwindcss-bin' && steps.plan-plugin.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.plan-plugin.outputs.version }}
          NPM: ${{ steps.plan-plugin.outputs.npm }}
        run: |
          set -euo pipefail
          license=$(yq -p=toml -oy '.tool."tailwindcss-bin".plugin.upstream-license' "$PKG_DIR/pyproject.toml")
          meta=$(curl -fsSL "https://registry.npmjs.org/$NPM/$VERSION")
          curl -fsSL "$(jq -r .dist.tarball <<<"$meta")" | tar -xzf - -O package/LICENSE > "$PKG_DIR/$license"
          yq -i -p=toml -o=toml \
            ".project.version = \"$VERSION\" |
             .tool.hatch.build.targets.wheel.hooks.\"npm-vendor\".packages[0].version = \"$VERSION\" |
             .tool.hatch.build.targets.wheel.hooks.\"npm-vendor\".packages[0].integrity = \"$(jq -r .dist.integrity <<<"$meta")\"" \
            "$PKG_DIR/pyproject.toml"

      - name: lock the workspace
        if: >-
          steps.plan-core.outputs.changed == 'true' ||
          steps.plan-plugin.outputs.changed == 'true'
        run: uv lock

      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        if: >-
          steps.plan-core.outputs.changed == 'true' ||
          steps.plan-plugin.outputs.changed == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.plan-core.outputs.branch || steps.plan-plugin.outputs.branch }}
          commit-message: >-
            Update ${{ matrix.package }} to v${{ steps.plan-core.outputs.version || steps.plan-plugin.outputs.version }}
          title: >-
            Update ${{ matrix.package }} to v${{ steps.plan-core.outputs.version || steps.plan-plugin.outputs.version }}
          body: ${{ steps.plan-core.outputs.body || steps.plan-plugin.outputs.body }}
