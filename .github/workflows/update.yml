name: Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: Package to update (defaults to tailwindcss-bin)
        required: false
      version:
        description: Upstream version (defaults to latest)
        required: false

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  update:
    name: Update (${{ matrix.package }})
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.package == '' ||
      github.event.inputs.package == matrix.package
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - tailwindcss-bin
          - tailwindcss-bin-tailwindcss-motion
          - tailwindcss-bin-tw-animate-css
    env:
      PACKAGE: ${{ matrix.package }}
      PKG_DIR: packages/${{ matrix.package }}
      VERSION: ${{ github.event.inputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: plan update
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          case "$PACKAGE" in
            tailwindcss-bin)
              version=${version:-$(gh release view --repo tailwindlabs/tailwindcss --json tagName --jq '.tagName[1:]')}
              body=https://github.com/tailwindlabs/tailwindcss/releases/tag/v$version
              ;;
            *)
              npm=$(yq -p=toml -oy '.tool."tailwindcss-bin".plugin.npm' "$PKG_DIR/pyproject.toml")
              version=${version:-$(curl -fsSL "https://registry.npmjs.org/$npm/latest" | jq -r .version)}
              body=https://www.npmjs.com/package/$npm/v/$version
              echo "npm=$npm" >> "$GITHUB_OUTPUT"
              ;;
          esac
          branch="update/$PACKAGE-v$version"
          current=$(uv version --package "$PACKAGE" --short)
          if [ "$current" = "$version" ] || git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "changed=true"
            echo "version=$version"
            echo "branch=$branch"
            echo "body=$body"
          } >> "$GITHUB_OUTPUT"

      - name: apply update
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          NPM: ${{ steps.plan.outputs.npm }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            tailwindcss-bin)
              repo=tailwindlabs/tailwindcss
              gh release view "v$VERSION" --repo "$repo" --json assets --jq '
                .assets[] | select(.name | startswith("tailwindcss-"))
                | "\(.name[11:] | rtrimstr(".exe")) = \"\(
                    .digest // error("\(.name) has no digest") | .[7:]
                  )\""' > "$RUNNER_TEMP/pins"
              curl -fsSL "https://raw.githubusercontent.com/$repo/v$VERSION/LICENSE" \
                -o "$PKG_DIR/LICENSE-tailwindcss"
              yq -i -p=toml -o=toml ".project.version = \"$VERSION\"" "$PKG_DIR/pyproject.toml"
              awk -v pins="$RUNNER_TEMP/pins" '
                /^\[tool\.tailwindcss-bin\.sha256\]/ { print; while ((getline l < pins) > 0) print l; close(pins); skip=1; next }
                skip && /^\[/ { skip=0 } skip { next } { print }
              ' "$PKG_DIR/pyproject.toml" > "$PKG_DIR/pyproject.toml.tmp"
              mv "$PKG_DIR/pyproject.toml.tmp" "$PKG_DIR/pyproject.toml"
              ;;
            *)
              license=$(yq -p=toml -oy '.tool."tailwindcss-bin".plugin.upstream-license' "$PKG_DIR/pyproject.toml")
              meta=$(curl -fsSL "https://registry.npmjs.org/$NPM/$VERSION")
              curl -fsSL "$(jq -r .dist.tarball <<<"$meta")" | tar -xzf - -O package/LICENSE > "$PKG_DIR/$license"
              yq -i -p=toml -o=toml \
                ".project.version = \"$VERSION\" |
                 .tool.hatch.build.targets.wheel.hooks.\"npm-vendor\".packages[0].version = \"$VERSION\" |
                 .tool.hatch.build.targets.wheel.hooks.\"npm-vendor\".packages[0].integrity = \"$(jq -r .dist.integrity <<<"$meta")\"" \
                "$PKG_DIR/pyproject.toml"
              ;;
          esac

      - name: lock the workspace
        if: steps.plan.outputs.changed == 'true'
        run: uv lock

      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        if: steps.plan.outputs.changed == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.plan.outputs.branch }}
          commit-message: Update ${{ matrix.package }} to v${{ steps.plan.outputs.version }}
          title: Update ${{ matrix.package }} to v${{ steps.plan.outputs.version }}
          body: ${{ steps.plan.outputs.body }}
