name: Update

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: Package to update
        type: choice
        default: tailwindcss-bin
        options:
          - tailwindcss-bin
          - tailwindcss-bin-tailwindcss-motion
          - tailwindcss-bin-tw-animate-css
      version:
        description: Upstream version (defaults to latest)
        required: false

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  update:
    name: Update (${{ matrix.package }})
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - tailwindcss-bin
          - tailwindcss-bin-tailwindcss-motion
          - tailwindcss-bin-tw-animate-css
    env:
      PACKAGE: ${{ matrix.package }}
      PKG_DIR: packages/${{ matrix.package }}
      VERSION: ${{ github.event.inputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          python-version: "3.14"

      - name: plan core update
        id: plan-core
        if: >-
          matrix.package == 'tailwindcss-bin' &&
          (github.event_name == 'schedule' || inputs.package == matrix.package)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          version=${version:-$(gh release view --repo tailwindlabs/tailwindcss --json tagName --jq '.tagName[1:]')}
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: plan plugin update
        id: plan-plugin
        if: >-
          matrix.package != 'tailwindcss-bin' &&
          (github.event_name == 'schedule' || inputs.package == matrix.package)
        run: |
          set -euo pipefail
          npm=$(yq -p=toml -oy '.tool."tailwindcss-bin".plugin.npm' "$PKG_DIR/pyproject.toml")
          version=${VERSION#v}
          version=${version:-$(curl -fsSL "https://registry.npmjs.org/$npm/latest" | jq -r .version)}
          {
            echo "version=$version"
            echo "npm=$npm"
          } >> "$GITHUB_OUTPUT"

      - name: check update
        id: plan
        if: github.event_name == 'schedule' || inputs.package == matrix.package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan-core.outputs.version || steps.plan-plugin.outputs.version }}
          NPM: ${{ steps.plan-plugin.outputs.npm }}
        run: |
          set -euo pipefail
          version=$VERSION
          branch="update/$PACKAGE-v$version"
          current=$(uv version --package "$PACKAGE" --short)
          if uv run --frozen --only-group build python - "$current" "$version" <<'PY_VERSION'
          import re
          import sys
          from packaging.version import InvalidVersion, Version

          current, candidate = sys.argv[1:]
          if not re.fullmatch(r"\d+\.\d+\.\d+", candidate):
              print(f"Expected a stable upstream X.Y.Z version: {candidate!r}", file=sys.stderr)
              sys.exit(2)
          try:
              installed = Version(current)
              upstream = Version(candidate)
          except InvalidVersion as error:
              print(error, file=sys.stderr)
              sys.exit(2)
          sys.exit(0 if upstream > installed else 1)
          PY_VERSION
          then
            :
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')
          changed=true
          if [ -n "$existing" ]; then changed=false; fi
          {
            echo "changed=$changed"
            echo "version=$version"
            echo "branch=$branch"
            echo "npm=$NPM"
            echo "existing-pr=$existing"
          } >> "$GITHUB_OUTPUT"

      - name: apply core update
        if: matrix.package == 'tailwindcss-bin' && steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --repo tailwindlabs/tailwindcss --json assets --jq '
            [.assets[]
              | select(.name | startswith("tailwindcss-"))
              | {(.name[11:] | rtrimstr(".exe")): (.digest // error("\(.name) has no digest") | .[7:])}
            ] | add' > "$RUNNER_TEMP/pins.json"
          curl -fsSL "https://raw.githubusercontent.com/tailwindlabs/tailwindcss/v$VERSION/LICENSE" \
            -o "$PKG_DIR/LICENSE-tailwindcss"
          yq -i -p=toml -o=toml \
            ".project.version = \"$VERSION\" |
             .tool.\"tailwindcss-bin\".sha256 = load(\"$RUNNER_TEMP/pins.json\")" \
            "$PKG_DIR/pyproject.toml"

      - name: apply plugin update
        if: matrix.package != 'tailwindcss-bin' && steps.plan.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          NPM: ${{ steps.plan.outputs.npm }}
        run: |
          set -euo pipefail
          license=$(yq -p=toml -oy '.tool."tailwindcss-bin".plugin.upstream-license' "$PKG_DIR/pyproject.toml")
          meta=$(curl -fsSL "https://registry.npmjs.org/$NPM/$VERSION")
          curl -fsSL "$(jq -r .dist.tarball <<<"$meta")" | tar -xzf - -O package/LICENSE > "$PKG_DIR/$license"
          yq -i -p=toml -o=toml \
            ".project.version = \"$VERSION\" |
             .tool.hatch.build.targets.wheel.hooks.\"npm-vendor\".packages[0].version = \"$VERSION\" |
             .tool.hatch.build.targets.wheel.hooks.\"npm-vendor\".packages[0].integrity = \"$(jq -r .dist.integrity <<<"$meta")\"" \
            "$PKG_DIR/pyproject.toml"

      - name: lock the workspace
        if: steps.plan.outputs.changed == 'true'
        run: uv lock

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pull-request
        if: steps.plan.outputs.changed == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          reviewers: sudosubin
          branch: ${{ steps.plan.outputs.branch }}
          commit-message: >-
            feat(${{ matrix.package }}): Update ${{ matrix.package }} to v${{ steps.plan.outputs.version }}
          title: >-
            feat(${{ matrix.package }}): Update ${{ matrix.package }} to v${{ steps.plan.outputs.version }}
          body: |
            > ##### This pr was automatically generated by [`update.yml`](https://github.com/sudosubin/tailwindcss-bin/actions/workflows/update.yml).

            Update the package version to `v${{ steps.plan.outputs.version }}`.

            ${{ matrix.package == 'tailwindcss-bin' && format('https://github.com/tailwindlabs/tailwindcss/releases/tag/v{0}', steps.plan.outputs.version) || format('https://www.npmjs.com/package/{0}/v/{1}', steps.plan.outputs.npm, steps.plan.outputs.version) }}

      - name: run CI for the update PR
        if: >-
          steps.pull-request.outputs.pull-request-number != '' ||
          steps.plan.outputs.existing-pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number || steps.plan.outputs.existing-pr }}
        run: |
          sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" --jq .total_count)
          if [ "$runs" = 0 ]; then gh workflow run ci.yml --ref "$BRANCH"; fi
