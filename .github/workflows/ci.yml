name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          python-version: "3.14"

      - name: verify uv.lock
        run: uv lock --check

      - name: run pre-commit hooks
        run: uv run --frozen --only-group dev prek run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.python }})
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          python-version: ${{ matrix.python }}

      - name: run the tests
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          uv sync --frozen --only-group tox
          uv run --frozen --only-group tox tox -c packages/tailwindcss-bin -e "build,$PYTHON" --parallel 1

  build:
    name: Build (${{ matrix.package }} / ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: tailwindcss-bin
            runner: ubuntu-24.04
            method: cibuildwheel
          - package: tailwindcss-bin
            runner: ubuntu-24.04-arm
            method: cibuildwheel
          - package: tailwindcss-bin
            runner: macos-latest
            method: cibuildwheel
          - package: tailwindcss-bin
            runner: windows-latest
            method: cibuildwheel
          - package: tailwindcss-bin-tailwindcss-motion
            runner: ubuntu-24.04-arm
            method: uv
          - package: tailwindcss-bin-tw-animate-css
            runner: ubuntu-24.04-arm
            method: uv

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          python-version: "3.14"

      - name: export build constraints
        shell: bash
        run: |
          uv export --frozen --only-group build --no-emit-project -o .tox/build-constraints.txt
          uv export --frozen --only-group test --no-emit-project -o .tox/test-requirements.txt

      - name: build plugin wheels for platform tests
        if: matrix.method == 'cibuildwheel'
        shell: bash
        run: |
          uv build --wheel --package tailwindcss-bin-tailwindcss-motion --out-dir .tox/plugin-wheelhouse --build-constraint .tox/build-constraints.txt --require-hashes
          uv build --wheel --package tailwindcss-bin-tw-animate-css --out-dir .tox/plugin-wheelhouse --build-constraint .tox/build-constraints.txt --require-hashes

      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        if: matrix.method == 'cibuildwheel'
        with:
          package-dir: packages/${{ matrix.package }}
          output-dir: dist

      - name: build the wheel
        if: matrix.method == 'uv'
        env:
          PACKAGE: ${{ matrix.package }}
        run: uv build --sdist --wheel --package "$PACKAGE" --build-constraint .tox/build-constraints.txt --require-hashes

      - name: validate wheel metadata
        shell: bash
        run: uv run --frozen --only-group audit twine check --strict dist/*

  release:
    name: Tag tested releases
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock

      - name: tag and dispatch releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packages=$(uv workspace list)
          for package in $packages; do
            version=$(uv version --package "$package" --short)
            [[ "$version" =~ ^[0-9]+(\.[0-9]+)*(\.post[0-9]+)?$ ]] || continue
            tag="$package@v$version"
            if ! git show-ref --verify --quiet "refs/tags/$tag"; then
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
            tag_sha=$(git rev-parse "$tag^{commit}")
            state=$(TAG="$tag" gh run list --workflow release.yml --commit "$tag_sha" --limit 100 \
              --json databaseId,displayTitle,status,conclusion --jq '
                [.[] | select(.displayTitle == "Release " + env.TAG)] | max_by(.databaseId) |
                if . == null then "missing"
                elif .status != "completed" then "running"
                else .conclusion end')
            case "$state" in
              running|success) continue ;;
            esac
            gh workflow run release.yml --ref "$tag"
          done
