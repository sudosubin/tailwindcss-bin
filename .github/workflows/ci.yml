name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          python-version: "3.14"

      - name: verify uv.lock
        run: uv lock --check

      - name: run pre-commit hooks
        run: uv run --frozen --only-group dev prek run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.python }})
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          python-version: ${{ matrix.python }}

      - name: run the tests
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          uv sync --frozen --only-group tox
          uv run --frozen --only-group tox tox -c packages/tailwindcss-bin -e "build,$PYTHON" --parallel 1

  build:
    name: Build (${{ matrix.package }} / ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: tailwindcss-bin
            runner: ubuntu-24.04
            method: cibuildwheel
          - package: tailwindcss-bin
            runner: ubuntu-24.04-arm
            method: cibuildwheel
          - package: tailwindcss-bin
            runner: macos-latest
            method: cibuildwheel
          - package: tailwindcss-bin
            runner: windows-latest
            method: cibuildwheel
          - package: tailwindcss-bin-tailwindcss-motion
            runner: ubuntu-24.04-arm
            method: uv
          - package: tailwindcss-bin-tw-animate-css
            runner: ubuntu-24.04-arm
            method: uv

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          python-version: "3.14"

      - name: export build constraints
        shell: bash
        run: |
          mkdir -p .tox
          uv export --frozen --only-group build --no-emit-project -o .tox/build-constraints.txt
          uv export --frozen --only-group test --no-emit-project -o .tox/test-requirements.txt

      - name: build plugin wheels for platform tests
        if: matrix.method == 'cibuildwheel'
        shell: bash
        run: |
          uv build --wheel --package tailwindcss-bin-tailwindcss-motion --out-dir .tox/plugin-wheelhouse --build-constraint .tox/build-constraints.txt --require-hashes
          uv build --wheel --package tailwindcss-bin-tw-animate-css --out-dir .tox/plugin-wheelhouse --build-constraint .tox/build-constraints.txt --require-hashes

      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        if: matrix.method == 'cibuildwheel'
        with:
          package-dir: packages/${{ matrix.package }}
          output-dir: dist

      - name: build the wheel
        if: matrix.method == 'uv'
        env:
          PACKAGE: ${{ matrix.package }}
        run: uv build --sdist --wheel --package "$PACKAGE" --build-constraint .tox/build-constraints.txt --require-hashes

      - name: validate wheel metadata
        shell: bash
        run: uv run --frozen --only-group audit twine check --strict dist/*

  linux-baseline:
    name: Linux baseline (${{ matrix.image }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            libc: gnu
            image: debian:stretch-slim
          - target: linux-x64-musl
            libc: musl
            image: alpine:3.24
    env:
      TAILWINDCSS_BIN_TARGET: ${{ matrix.target }}
      LIBC: ${{ matrix.libc }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          python-version: "3.14"

      - name: build wheels for the Linux runtime
        run: |
          mkdir -p .tox
          uv export --frozen --only-group build --no-emit-project -o .tox/build-constraints.txt
          uv export --frozen --only-group test --no-emit-project -o .tox/test-requirements.txt
          uv build --wheel --all-packages --out-dir ".tox/linux-wheelhouse/$TAILWINDCSS_BIN_TARGET" --build-constraint .tox/build-constraints.txt --require-hashes

      - name: prepare Python for the Linux runtime
        run: uv python install "cpython-3.14-linux-x86_64-$LIBC" --install-dir "$RUNNER_TEMP/python" --no-bin

      # Node actions require newer glibc, so only the tests run in the image.
      - name: test the installed wheels in the Linux runtime
        run: |
          docker run --rm -i --workdir /project \
            -v "$GITHUB_WORKSPACE:/project:ro" \
            -v "$GITHUB_WORKSPACE/.tox/linux-wheelhouse/$TAILWINDCSS_BIN_TARGET:/wheels:ro" \
            -v "$RUNNER_TEMP/python/cpython-3.14-linux-x86_64-$LIBC:/python:ro" \
            "$IMAGE" sh -s <<'SH'
          set -eu
          if [ -f /etc/alpine-release ]; then apk add --no-cache libstdc++ libgcc; fi
          /python/bin/python3.14 -m venv /venv
          /venv/bin/python -m pip install --require-hashes -r .tox/test-requirements.txt
          /venv/bin/python -m pip install --no-index --no-deps /wheels/*.whl
          exec /venv/bin/python -m pytest -p no:cacheprovider \
            packages/tailwindcss-bin/tests/test_cli.py packages/tailwindcss-bin/tests/test_plugins.py
          SH

  check:
    name: Check
    needs: [lint, test, build, linux-baseline]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: require all checks to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done

  release:
    name: Tag tested releases
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          python-version: "3.14"

      - name: tag and dispatch unpublished versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --frozen --only-group build python - <<'PY' > "$RUNNER_TEMP/release-versions.txt"
          import tomllib
          from pathlib import Path
          from packaging.version import Version

          for path in sorted(Path("packages").glob("*/pyproject.toml")):
              project = tomllib.loads(path.read_text())["project"]
              version = Version(project["version"])
              if not (version.is_prerelease or version.is_devrelease or version.epoch or version.local):
                  print(project["name"], project["version"])
          PY
          while read -r package version; do
            tag="$package@v$version"
            if ! git show-ref --verify --quiet "refs/tags/$tag"; then
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
            status=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$package/$version/json")
            case "$status" in
              200|404) ;;
              *) echo "PyPI returned HTTP $status for $package $version" >&2; exit 1 ;;
            esac
            tag_sha=$(git rev-parse "$tag^{commit}")
            state=$(gh run list --workflow release.yml --commit "$tag_sha" --limit 100 \
              --json databaseId,displayTitle,status,conclusion | \
              jq -r --arg title "Release $tag" '
                [.[] | select(.displayTitle == $title)] | max_by(.databaseId) |
                if . == null then "missing"
                elif .status != "completed" then "running"
                else .conclusion end')
            if [ "$state" = running ] || { [ "$status" = 200 ] && [ "$state" = success ]; }; then
              continue
            fi
            gh workflow run release.yml --ref "$tag"
          done < "$RUNNER_TEMP/release-versions.txt"
