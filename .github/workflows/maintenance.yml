name: Maintenance

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  hooks:
    name: Update hooks
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          python-version: "3.14"

      - name: preserve an open maintenance PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh pr list --state open --head maintenance/pre-commit --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: update pre-commit hooks
        if: steps.existing.outputs.number == ''
        run: uv run --frozen --only-group maintenance prek update

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pull-request
        if: steps.existing.outputs.number == ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          assignees: sudosubin
          branch: maintenance/pre-commit
          commit-message: "chore: Update pre-commit hooks"
          title: "chore: Update pre-commit hooks"
          body: Update the pinned pre-commit hook revisions.

      - name: run CI for the maintenance PR
        if: steps.pull-request.outputs.pull-request-number != '' || steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number || steps.existing.outputs.number }}
        run: |
          sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" --jq .total_count)
          if [ "$runs" = 0 ]; then gh workflow run ci.yml --ref maintenance/pre-commit; fi
