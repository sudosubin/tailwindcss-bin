version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    assignees:
      - sudosubin
    allow:
      - dependency-type: all
    groups:
      python-tools:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    assignees:
      - sudosubin
    groups:
      github-actions:
        patterns: ["*"]
